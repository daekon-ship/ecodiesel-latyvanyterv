name: Takarítás (rossz helyre feltöltött public_html másolat)
on:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: public_html törlése, csak ha a mi feltöltőnk hozta létre
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          LIST=$(curl -sS --list-only "ftp://$S/public_html/" --user "$U:$P" || true)
          echo "$LIST"
          if echo "$LIST" | grep -qx ".ftp-deploy-sync-state.json" && ! echo "$LIST" | grep -qiE "wp-|\.php$"; then
            lftp -u "$U,$P" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; rm -r public_html; bye" "$S"
            echo "public_html törölve"
          else
            echo "nem a mi mappánk vagy nincs ilyen – nem törlök"
          fi
          echo "== gyoker most"; curl -sS --list-only "ftp://$S/" --user "$U:$P"
